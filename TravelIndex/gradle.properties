org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.5 solo avisa de que no conoce la API 36 (compila bien); se silencia el aviso.
android.suppressUnsupportedCompileSdk=36
# Identificador de paquete configurable (cámbialo antes del build definitivo)
travelindex.applicationId=com.travelindex.app
travelindex.versionCode=41
travelindex.versionName=0.8.9
# Muestra la fila opcional «Apoya el proyecto» en Perfil (enlace a PayPal). false = se oculta.
travelindex.showDonations=true
