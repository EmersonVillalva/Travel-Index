name: Build TravelIndex

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Generar también AAB y APK firmados de release (necesita los 4 secretos)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TravelIndex
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      WANT_RELEASE: ${{ github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Revisiones estáticas (informativas)
        continue-on-error: true
        run: |
          python3 tools/check_project.py
          python3 tools/check_resources.py
          python3 tools/check_forms.py
          python3 tools/check_imports.py
          python3 tools/check_migration.py

      - name: Tests unitarios
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Informe de tests (si fallan)
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TravelIndex-informe-tests
          path: TravelIndex/app/build/reports/tests/

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TravelIndex-debug-apk
          path: TravelIndex/app/build/outputs/apk/debug/*.apk

      - name: Falta la firma
        if: env.WANT_RELEASE == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Para generar el release faltan los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD."
          exit 1

      - name: Preparar firma (secretos del repositorio)
        if: env.WANT_RELEASE == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: AAB y APK de release
        if: env.WANT_RELEASE == 'true' && env.HAS_KEYSTORE == 'true'
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Subir release
        if: env.WANT_RELEASE == 'true' && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TravelIndex-release
          path: |
            TravelIndex/app/build/outputs/bundle/release/*.aab
            TravelIndex/app/build/outputs/apk/release/*.apk
